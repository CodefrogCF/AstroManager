<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, user-scalable=no">
  <title>AstroManager Sky Atlas</title>
  <style>
    html, body, #aladin { height:100%;width:100%;margin:0;overflow:hidden;background:#10151f; }
    /* Keep the mandatory source attribution visible. Hide only the
       optional Aladin Lite widgets, never the survey canvas or branding. */
    .astro-hide-aladin-ui #aladin .aladin-fov,
    .astro-hide-aladin-ui #aladin .aladin-stack-control,
    .astro-hide-aladin-ui #aladin .aladin-stack-box,
    .astro-hide-aladin-ui #aladin .aladin-fullScreen-control,
    .astro-hide-aladin-ui #aladin .aladin-simbadPointer-control,
    .astro-hide-aladin-ui #aladin .aladin-projection-control,
    .astro-hide-aladin-ui #aladin .aladin-grid-control,
    .astro-hide-aladin-ui #aladin .aladin-settings-control,
    .astro-hide-aladin-ui #aladin .aladin-share-control,
    .astro-hide-aladin-ui #aladin .aladin-status-bar,
    .astro-hide-aladin-ui #aladin .aladin-location,
    .astro-hide-aladin-ui #aladin .aladin-cooFrame,
    .astro-hide-aladin-ui #aladin .aladin-selectionMode-control,
    .astro-hide-aladin-ui #aladin .aladin-colorPicker-control {
      display: none !important;
    }
    #warning { position:absolute;z-index:20;top:0;left:0;right:0;display:none;
      background:#38252b;color:#fff;font:14px system-ui;padding:10px; }
  </style>
</head>
<body>
  <div id="aladin"></div>
  <div id="warning" role="alert"></div>
  <script src="atlas_bridge.js"></script>
  <!-- The npm/jsDelivr build is an ES module (contains export statements).
       Load it as a module, expose its API to the existing atlas bridge, then boot.
       The HiPS surveys still require network access. -->
  <script type="module">
    try {
      const aladinModule = await import(
        'https://cdn.jsdelivr.net/npm/aladin-lite@3.8.1/dist/aladin.min.js'
      );
      const api = aladinModule.default ?? aladinModule.A ?? aladinModule;
      if (!api || !api.init || typeof api.init.then !== 'function' ||
          typeof api.aladin !== 'function') {
        throw new Error('The ES module did not expose a compatible Aladin Lite API.');
      }
      window.A = api;
      window.AstroManagerAtlas.boot();
    } catch (error) {
      window.AstroManagerAtlas.fatal(
        'Aladin Lite module could not be initialized: ' +
        (error instanceof Error ? error.message : String(error))
      );
    }
  </script>
</body>
</html>
