<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, user-scalable=no">
  <title>AstroManager Sky Atlas</title>
  <style>
    html, body, #aladin { height:100%;width:100%;margin:0;overflow:hidden;background:#10151f; }
    #warning { position:absolute;z-index:20;top:0;left:0;right:0;display:none;
      background:#38252b;color:#fff;font:14px system-ui;padding:10px; }
  </style>
</head>
<body>
  <div id="aladin"></div>
  <div id="warning" role="alert"></div>
  <script src="atlas_bridge.js"></script>
  <!-- Use the URL shown in the upstream documentation for this diagnostic build.
       After confirming loading, pin a verified version for reproducible releases.
       Remote script and sky survey tiles require an internet connection. -->
  <script src="https://aladin.cds.unistra.fr/AladinLite/api/v3/latest/aladin.js"
          charset="utf-8"
          onerror="window.AstroManagerAtlas.fatal('Aladin Lite JavaScript could not be loaded from CDS. Inspect the aladin.js request in Chrome DevTools > Network (HTTP status / CSP / DNS).')"></script>
  <script>window.AstroManagerAtlas.boot();</script>
</body>
</html>
