name: AstroManager
description: "Offline-first astrophotography planning, observing logs, and sky atlas."
publish_to: 'none'
version: 0.6.0+6

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2
  shared_preferences: ^2.5.6
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  geolocator: ^14.1.2
  timezone: ^0.11.2
  http: ^1.6.0
  uuid: ^4.6.0
  webview_flutter: ^4.14.1
  web: ^1.1.2
  file_picker: ^13.3.2
  archive: ^4.6.0
  crypto: ^3.0.6
  flutter_local_notifications: ^22.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  sqlite3: ^3.5.2
  build_runner: ^2.17.1
  flutter_launcher_icons: 0.14.4

flutter:

  uses-material-design: true

  assets:
    - assets/catalog/openngc_20260501.json
    - assets/catalog/LICENSE-OpenNGC.txt
    - assets/atlas/atlas.html
    - assets/atlas/atlas_bridge.js

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/astromanager.png"
  remove_alpha_ios: true

  web:
    generate: true
    image_path: "assets/icons/astromanager.png"
    background_color: "#00452D"
    theme_color: "#00452D"

  windows:
    generate: true
    image_path: "assets/icons/astromanager.png"
    icon_size: 256

  macos:
    generate: false
    image_path: "assets/icons/astromanager.png"
